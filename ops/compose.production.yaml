name: ${COMPOSE_PROJECT_NAME:-liang-ge-ren-production}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-app: &app
  image: ${APP_IMAGE:?Run scripts/deploy.sh to build a versioned image}
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: ['/tmp:size=32m,mode=1777']
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  logging: *logging
  environment: &environment
    NODE_ENV: production
    DATABASE_URL: postgresql://${POSTGRES_USER:-couple}:${POSTGRES_PASSWORD:?Missing database password}@db:5432/${POSTGRES_DB:-couple}
    APP_URL: https://${DOMAIN:?Set DOMAIN to your real domain}
    PORT: 33442
    COOKIE_SECURE: 'true'
    TRUST_PROXY: loopback,linklocal,uniquelocal
    LOG_LEVEL: ${LOG_LEVEL:-info}
    REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
    REQUIRE_VERIFIED_EMAIL: ${REQUIRE_VERIFIED_EMAIL:-true}
    SUPPORT_EMAIL: ${SUPPORT_EMAIL:?Set SUPPORT_EMAIL}
    OPERATOR_NAME: ${OPERATOR_NAME:-}
    APP_VERSION: ${APP_VERSION:-unknown}
    WECHAT_LOGIN_ENABLED: ${WECHAT_LOGIN_ENABLED:-false}
    BEICHEN_APP_ID: ${BEICHEN_APP_ID:-}
    BEICHEN_APP_KEY: ${BEICHEN_APP_KEY:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASS: ${SMTP_PASS:-}
    SMTP_FROM: ${SMTP_FROM:-}
  networks: [backend]
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-bookworm}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-couple}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing database password}
      POSTGRES_DB: ${POSTGRES_DB:-couple}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    restart: 'no'
    command: [node, dist/scripts/migrate.js]
    profiles: [tools]

  app:
    <<: *app
    networks: [backend, edge]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:33442/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  worker:
    <<: *app
    networks: [backend, outbound]
    command: [node, dist/server/worker.js]
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, node, dist/scripts/worker-health.js]
      interval: 15s
      timeout: 15s
      start_period: 30s
      retries: 4

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      app:
        condition: service_healthy

  backup:
    image: ${POSTGRES_IMAGE:-postgres:17-bookworm}
    user: '${BACKUP_UID:-0}:${BACKUP_GID:-0}'
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging
    entrypoint: [sh, /ops/backup-loop.sh]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-couple}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Missing database password}
      PGDATABASE: ${POSTGRES_DB:-couple}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backup-loop.sh:/ops/backup-loop.sh:ro
      - ${BACKUP_DIR:?Set BACKUP_DIR}:/backups
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'test -s /backups/.last-success && test "$$(($$(date +%s) - $$(cat /backups/.last-success)))" -lt 93600']
      interval: 60s
      timeout: 5s
      start_period: 120s
      retries: 3

networks:
  backend:
    internal: true
  edge:
  outbound:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
