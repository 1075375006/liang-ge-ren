name: liang-ge-ren

x-app: &app
  image: liang-ge-ren:local
  build: .
  init: true
  restart: unless-stopped
  environment: &env
    NODE_ENV: production
    DATABASE_URL: postgresql://${POSTGRES_USER:-couple}:${POSTGRES_PASSWORD:?请在.env设置数据库密码}@db:5432/${POSTGRES_DB:-couple}
    APP_URL: ${APP_URL:-http://localhost:33442}
    PORT: 33442
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    WECHAT_LOGIN_ENABLED: ${WECHAT_LOGIN_ENABLED:-false}
    BEICHEN_APP_ID: ${BEICHEN_APP_ID:-}
    BEICHEN_APP_KEY: ${BEICHEN_APP_KEY:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASS: ${SMTP_PASS:-}
    SMTP_FROM: ${SMTP_FROM:-}
  depends_on:
    db:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-couple}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在.env设置数据库密码}
      POSTGRES_DB: ${POSTGRES_DB:-couple}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: [node, dist/scripts/migrate.js]
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-33442}:33442"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:33442/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: [node, dist/server/worker.js]
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, node, dist/scripts/worker-health.js]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3

volumes:
  postgres_data:
