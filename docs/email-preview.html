<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-src 'self' about:; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'"
    />
    <title>两个人 · 邮件样式预览册</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #4b3940;
        --muted: #95838b;
        --rose: #ad4b68;
        --line: #eadfe3;
        --paper: #fffdfb;
        --theme-accent: #b7395d;
        --theme-background: #fff0f3;
        --preview-width: 640px;
        font:
          14px/1.65 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f9f5f3;
        color: var(--ink);
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible {
        outline: 3px solid #ac5b7b;
        outline-offset: 4px;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      .page {
        max-width: 1380px;
        margin: 0 auto;
        padding: 34px 40px 28px;
      }
      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .brand-heart {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 13px;
        background: #b65c77;
        color: #fff3f5;
        font-size: 27px;
        transform: rotate(-5deg);
      }
      .brand strong {
        display: block;
        font-size: 20px;
        letter-spacing: 2px;
      }
      .brand small {
        display: block;
        color: #b19aa4;
        font-size: 8px;
        letter-spacing: 2px;
      }
      .sample-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #e6d9df;
        border-radius: 99px;
        padding: 7px 12px;
        color: #9c7a8a;
        background: #fffafc;
        font-size: 11px;
        white-space: nowrap;
      }
      .sample-badge::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #b58b9a;
      }
      .intro {
        padding: 40px 0 27px;
      }
      .eyebrow {
        color: #b094a0;
        font-size: 10px;
        letter-spacing: 2.5px;
      }
      h1 {
        font-size: clamp(27px, 3vw, 38px);
        font-weight: 600;
        letter-spacing: 1px;
        line-height: 1.45;
        margin: 9px 0 10px;
      }
      h1 span {
        color: #b16881;
      }
      .intro > p {
        color: var(--muted);
        font-size: 13px;
      }
      .workspace {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        gap: 25px;
        align-items: start;
      }
      .theme-panel,
      .preview-panel {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 30px #70475304;
      }
      .theme-panel {
        padding: 23px 19px 20px;
      }
      .panel-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 0 3px 17px;
      }
      .panel-heading h2 {
        font-size: 14px;
        font-weight: 600;
      }
      .panel-heading > span {
        color: #b29aa5;
        font-size: 10px;
      }
      .theme-grid {
        display: grid;
        gap: 10px;
      }
      .theme-option {
        width: 100%;
        min-width: 0;
        display: grid;
        grid-template-columns: 41px minmax(0, 1fr) 16px;
        align-items: center;
        gap: 11px;
        border: 1px solid #ede4e7;
        border-radius: 13px;
        padding: 14px 12px;
        background: #fff;
        text-align: left;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .theme-option:hover {
        border-color: #cfa9b8;
      }
      .theme-option.active {
        border-color: var(--card-accent);
        box-shadow: 0 0 0 2px #b6506b0b;
      }
      .theme-swatch {
        display: grid;
        place-items: center;
        width: 41px;
        height: 46px;
        background: var(--card-background);
        color: var(--card-accent);
        border-radius: 10px;
        font-size: 26px;
      }
      .theme-copy {
        min-width: 0;
      }
      .theme-copy strong {
        display: block;
        font-size: 13px;
        font-weight: 600;
      }
      .theme-copy small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.7;
        overflow-wrap: anywhere;
      }
      .theme-check {
        color: #a14e6d;
        font-size: 16px;
        opacity: 0;
      }
      .theme-option.active .theme-check {
        opacity: 1;
      }
      .theme-note {
        padding: 17px 4px 0;
        color: #a28a96;
        font-size: 10px;
        line-height: 1.9;
      }
      .preview-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 22px;
        border-bottom: 1px solid var(--line);
      }
      .preview-name {
        display: flex;
        align-items: center;
        gap: 11px;
        min-width: 0;
      }
      #selected-emoji {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        background: var(--theme-background);
        border-radius: 10px;
        font-size: 23px;
      }
      #selected-name {
        display: block;
        font-size: 14px;
        font-weight: 600;
      }
      .preview-name small {
        display: block;
        color: #a58d99;
        font-size: 10px;
        margin-top: 2px;
      }
      .width-controls {
        display: flex;
        padding: 4px;
        gap: 3px;
        background: #f4edef;
        border-radius: 10px;
      }
      .width-controls button {
        border: 0;
        padding: 6px 10px;
        border-radius: 7px;
        background: none;
        color: #a48b97;
        font-size: 11px;
        white-space: nowrap;
      }
      .width-controls button.active {
        background: #fff;
        color: #a45c77;
        box-shadow: 0 1px 5px #70475309;
      }
      .preview-stage {
        padding: 22px;
        display: flex;
        justify-content: center;
        background: #f1ecea;
      }
      .email-frame {
        display: block;
        width: min(100%, var(--preview-width));
        height: 950px;
        border: 1px solid #e5d9df;
        border-radius: 14px;
        background: var(--theme-background);
        box-shadow: 0 12px 28px #66424c0c;
        transition: width 0.2s;
      }
      .preview-footer {
        padding: 12px 19px;
        color: #a18c96;
        font-size: 10px;
        text-align: center;
        border-top: 1px solid var(--line);
      }
      .footer {
        color: #b29ba6;
        font-size: 10px;
        text-align: center;
        padding: 27px 12px 0;
      }
      .footer span {
        margin: 0 7px;
        color: #bd93a4;
      }
      .no-script {
        padding: 15px;
        color: #975873;
      }
      @media (max-width: 1000px) {
        .page {
          padding: 28px 24px;
        }
        .workspace {
          grid-template-columns: 265px minmax(0, 1fr);
          gap: 17px;
        }
        .theme-panel {
          padding: 19px 13px;
        }
        .theme-option {
          grid-template-columns: 34px minmax(0, 1fr) 12px;
          gap: 8px;
          padding: 12px 9px;
        }
        .theme-swatch {
          width: 34px;
          height: 41px;
          font-size: 23px;
        }
        .preview-top {
          padding: 17px 14px;
        }
        .preview-stage {
          padding: 15px;
        }
        .email-frame {
          height: 1110px;
        }
      }
      @media (max-width: 760px) {
        .page {
          padding: 24px 19px;
        }
        .intro {
          padding: 29px 0 23px;
        }
        .workspace {
          grid-template-columns: 1fr;
          gap: 20px;
        }
        .theme-panel {
          padding: 20px 16px 15px;
        }
        .theme-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
        }
        .theme-option {
          grid-template-columns: 34px minmax(0, 1fr);
          align-items: start;
          position: relative;
          padding: 12px;
        }
        .theme-check {
          position: absolute;
          right: 9px;
          top: 7px;
          font-size: 13px;
        }
        .theme-copy {
          padding-top: 2px;
        }
        .theme-copy strong {
          font-size: 12px;
          padding-right: 8px;
        }
        .theme-copy small {
          font-size: 10px;
          margin-top: 5px;
        }
        .theme-note {
          padding-top: 13px;
        }
        .preview-stage {
          padding: 13px;
        }
        .email-frame {
          height: 1080px;
        }
        .width-controls button {
          padding: 6px 8px;
        }
      }
      @media (max-width: 430px) {
        .page {
          padding: 20px 13px;
        }
        .brand strong {
          font-size: 18px;
        }
        .brand-heart {
          width: 35px;
          height: 35px;
          font-size: 24px;
        }
        .sample-badge {
          font-size: 10px;
          padding: 6px 9px;
          gap: 6px;
        }
        .intro > p {
          font-size: 12px;
          line-height: 1.9;
        }
        .theme-panel {
          padding: 17px 12px 14px;
        }
        .theme-option {
          display: flex;
          flex-direction: column;
          gap: 7px;
        }
        .theme-swatch {
          width: 32px;
          height: 35px;
          font-size: 21px;
        }
        .theme-copy small {
          line-height: 1.65;
        }
        .preview-top {
          flex-wrap: wrap;
          gap: 11px;
        }
        .preview-name {
          flex: 1 1 150px;
        }
        .preview-stage {
          padding: 0;
        }
        .email-frame {
          border: 0;
          border-radius: 0;
          height: 1150px;
        }
        .preview-footer {
          font-size: 9px;
          padding: 11px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topline">
        <div class="brand">
          <span class="brand-heart" aria-hidden="true">♡</span>
          <div><strong>两个人。</strong><small>BETTER, TOGETHER</small></div>
        </div>
        <span class="sample-badge">仅预览 · 不发送邮件</span>
      </header>
      <section class="intro" aria-labelledby="page-title">
        <span class="eyebrow">A LITTLE LETTER, JUST FOR YOU</span>
        <h1 id="page-title">给日常的小提醒，<span>选一张信纸。</span></h1>
        <p>十一种颜色，十一份心情。点选喜欢的样式，看看它来到邮箱时的模样。</p>
      </section>
      <div class="workspace">
        <section class="theme-panel" aria-labelledby="theme-heading">
          <div class="panel-heading">
            <h2 id="theme-heading">选择邮件样式</h2>
            <span>11 款小心意</span>
          </div>
          <div class="theme-grid" role="group" aria-label="11 种邮件主题">
            <button
              type="button"
              class="theme-option active"
              data-theme="strawberry"
              aria-pressed="true"
              style="--card-accent: #b7395d; --card-background: #fff0f3"
            >
              <span class="theme-swatch" aria-hidden="true">🍓</span>
              <span class="theme-copy"
                ><strong>草莓心事</strong
                ><small>莓果粉与小爱心，把日常写成一封甜甜的信。</small></span
              <span class="theme-check" aria-hidden="true">✓</span>
            </button>
            <button
              type="button"
              class="theme-option"
              data-theme="cream"
              aria-pressed="false"
              style="--card-accent: #855723; --card-background: #fff6e7"
            >
              <span class="theme-swatch" aria-hidden="true">🧁</span>
              <span class="theme-copy"
                ><strong>奶油来信</strong
                ><small>暖奶油色的小信纸，装下一点温柔和小确幸。</small></span
              <span class="theme-check" aria-hidden="true">✓</span>
            </button>
            <button
              type="button"
              class="theme-option"
              data-theme="mint"
              aria-pressed="false"
              style="--card-accent: #26715a; --card-background: #edf8f1"
            >
              <span class="theme-swatch" aria-hidden="true">🌿</span>
              <span class="theme-copy"
                ><strong>薄荷花园</strong
                ><small>清新的绿叶边框，陪你们慢慢收集好日常。</small></span
              <span class="theme-check" aria-hidden="true">✓</span>
            </button>
            <button
              type="button"
              class="theme-option"
              data-theme="sky"
              aria-pressed="false"
              style="--card-accent: #2f6597; --card-background: #edf6ff"
            >
              <span class="theme-swatch" aria-hidden="true">☁️</span>
              <span class="theme-copy"
                ><strong>云朵邮局</strong
                ><small>把小约定寄上蓝天，让柔软的云朵送到身边。</small></span
              <span class="theme-check" aria-hidden="true">✓</span>
            </button>
            <button
              type="button"
              class="theme-option"
              data-theme="lavender"
              aria-pressed="false"
              style="--card-accent: #7655a3; --card-background: #f4effb"
            >
              <span class="theme-swatch" aria-hidden="true">🪻</span>
              <span class="theme-copy"
                ><strong>紫色花笺</strong
                ><small>淡紫花朵与虚线信封，留住认真对待彼此的心意。</small></span
              <span class="theme-check" aria-hidden="true">✓</span>
            </button>
            <button
              type="button"
              class="theme-option"
              data-theme="night"
              aria-pressed="false"
              style="--card-accent: #e8c780; --card-background: #131a30"
            >
              <span class="theme-swatch" aria-hidden="true">🌙</span>
              <span class="theme-copy"
                ><strong>晚安星河</strong
                ><small>深蓝夜空和暖金小星星，把今天的心意悄悄点亮。</small></span
              <span class="theme-check" aria-hidden="true">✓</span>
            </button>
            <button
              type="button"
              class="theme-option"
              data-theme="line-puppy"
              aria-pressed="false"
              style="--card-accent: #8b5e3c; --card-background: #fff6d9"
            >
              <span class="theme-swatch" aria-hidden="true">🐶</span>
              <span class="theme-copy"
                ><strong>线条小狗日记</strong
                ><small>软乎乎的奶油黄和小狗脚印，适合每天写一句喜欢。</small></span
              <span class="theme-check" aria-hidden="true">✓</span>
            </button>
            <button
              type="button"
              class="theme-option"
              data-theme="lulu"
              aria-pressed="false"
              style="--card-accent: #7656a8; --card-background: #f3eeff"
            >
              <span class="theme-swatch" aria-hidden="true">🍬</span>
              <span class="theme-copy"
                ><strong>噜噜软糖</strong
                ><small>葡萄紫配薄荷绿，把两个人的好心情装进一颗软糖。</small></span
              <span class="theme-check" aria-hidden="true">✓</span>
            </button>
            <button
              type="button"
              class="theme-option"
              data-theme="nailong"
              aria-pressed="false"
              style="--card-accent: #9a641a; --card-background: #fff4c7"
            >
              <span class="theme-swatch" aria-hidden="true">🐲</span>
              <span class="theme-copy"
                ><strong>奶龙抱抱</strong
                ><small>奶黄色的小太阳和圆滚滚的拥抱，给坚持一点奖励。</small></span
              <span class="theme-check" aria-hidden="true">✓</span>
            </button>
            <button
              type="button"
              class="theme-option"
              data-theme="yibubu"
              aria-pressed="false"
              style="--card-accent: #3c639b; --card-background: #eaf2ff"
            >
              <span class="theme-swatch" aria-hidden="true">🧸</span>
              <span class="theme-copy"
                ><strong>一二布布乐园</strong
                ><small>蓝莓蓝和莓果红的轻快配色，记录你们一起完成的小事。</small></span
              <span class="theme-check" aria-hidden="true">✓</span>
            </button>
            <button
              type="button"
              class="theme-option"
              data-theme="tom-jerry"
              aria-pressed="false"
              style="--card-accent: #a45a20; --card-background: #fff1d6"
            >
              <span class="theme-swatch" aria-hidden="true">🐱🐭</span>
              <span class="theme-copy"
                ><strong>猫鼠追光</strong
                ><small>俏皮的奶酪黄和夜蓝色，今天也一起追到小小的快乐。</small></span
              <span class="theme-check" aria-hidden="true">✓</span>
            </button>
          </div>
          <p class="theme-note">
            这里展示同一封任务验收提醒。基础主题立即可用，连续完成约定还能解锁更多主题；实际邮件会带上对应的任务、兑换或验证信息。
          </p>
        </section>
        <section class="preview-panel" aria-labelledby="selected-name">
          <div class="preview-top">
            <div class="preview-name">
              <span id="selected-emoji" aria-hidden="true">🍓</span>
              <div>
                <strong id="selected-name" aria-live="polite">草莓心事</strong
                ><small>任务验收邮件 · 示例内容</small>
              </div>
            </div>
            <div class="width-controls" role="group" aria-label="预览阅读宽度">
              <button type="button" data-width="640" class="active" aria-pressed="true">宽屏</button
              ><button type="button" data-width="375" aria-pressed="false">手机</button>
            </div>
          </div>
          <div class="preview-stage">
            <iframe
              id="email-preview"
              class="email-frame"
              title="草莓心事邮件示例"
              sandbox=""
              referrerpolicy="no-referrer"
            ></iframe>
          </div>
          <div class="preview-footer">
            示例内容仅供查看。切换样式不会发送邮件，也不会更改账号设置。
          </div>
        </section>
      </div>
      <noscript
        ><p class="no-script">
          请在浏览器中允许此页面运行 JavaScript，以切换 11 款邮件预览。
        </p></noscript
      >
      <footer class="footer">两个人<span>♡</span>把喜欢，放进每一天</footer>
    </main>

    <script>
      (() => {
        const themes = JSON.parse(document.getElementById('theme-data').textContent);
        const preview = document.getElementById('email-preview');
        const root = document.documentElement;
        const options = Array.from(document.querySelectorAll('[data-theme]'));
        const widths = Array.from(document.querySelectorAll('[data-width]'));
        function chooseTheme(id) {
          const theme = themes.find((item) => item.id === id);
          if (!theme) return;
          options.forEach((button) => {
            const selected = button.dataset.theme === id;
            button.classList.toggle('active', selected);
            button.setAttribute('aria-pressed', String(selected));
          });
          root.style.setProperty('--theme-accent', theme.accent);
          root.style.setProperty('--theme-background', theme.background);
          document.getElementById('selected-name').textContent = theme.name;
          document.getElementById('selected-emoji').textContent = theme.emoji;
          preview.title = theme.name + '邮件示例';
          preview.srcdoc = theme.html;
        }
        options.forEach((button) =>
          button.addEventListener('click', () => chooseTheme(button.dataset.theme)),
        );
        widths.forEach((button) =>
          button.addEventListener('click', () => {
            root.style.setProperty('--preview-width', button.dataset.width + 'px');
            widths.forEach((item) => {
              const selected = item === button;
              item.classList.toggle('active', selected);
              item.setAttribute('aria-pressed', String(selected));
            });
          }),
        );
        chooseTheme(themes[0].id);
      })();
    </script>
